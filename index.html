<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffb8d0"><title>こうや♡ももちゃんのやりたいことリスト</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#694657;background:repeating-linear-gradient(45deg,#fff2f7 0 20px,#ffebf2 20px 40px)}main{max-width:720px;margin:auto;padding:18px 14px 60px}.hero,.section{background:#fffdfef0;border:2px solid #f7bfd2;border-radius:24px;box-shadow:0 5px 15px #d37b9c18;padding:18px;margin-bottom:18px}.hero{text-align:center}.bears{font-size:38px}.tiny{font-size:12px;letter-spacing:2px;color:#c77898}h1{font-size:clamp(22px,6vw,32px);margin:10px 0;color:#b95380}h2{font-size:19px;margin:0 0 12px;color:#aa5479}.count{font-size:28px;font-weight:800;color:#d85d91}.progress{height:14px;border-radius:20px;background:#ffe0ea;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffa5c2,#ef6da3);transition:width .2s}.item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px dashed #f4d1de;cursor:pointer;line-height:1.5}.item:last-child{border:0}.item input{width:22px;height:22px;accent-color:#e76c9b;flex-shrink:0}.item:has(input:checked){color:#b88a9d;background:#fff2f7;border-radius:10px}.item:has(input:checked) span{text-decoration:line-through}.section small{float:right;color:#ba8298}.buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.buttons button{border:1px solid #efaac4;background:#fff;border-radius:999px;padding:10px 14px;color:#a64b75;font-weight:700;cursor:pointer}.buttons button.primary{background:#e76c9b;color:#fff}.note{font-size:12px;line-height:1.7;color:#9d7284;text-align:center}footer{text-align:center;color:#ba7391;font-size:13px;margin-top:25px}</style></head><body><main><div class="hero"><div class="bears">🧸💗🧸</div><div class="tiny">OUR COUPLE BUCKET LIST</div><h1>こうや ♡ ももちゃん<br>2人でやりたいことリスト</h1><div class="count"><span id="done">0</span> / 60 ♡</div><div class="progress"><div class="fill" id="fill"></div></div><p id="message">2人の楽しい時間、ここからスタート♡</p><div class="buttons"><button class="primary" onclick="exportList()">💌 チェック状況を共有</button><button onclick="downloadBackup()">📁 バックアップ保存</button><button onclick="document.getElementById('restore').click()">📂 読み込む</button><input hidden id="restore" type="file" accept="application/json" onchange="restoreBackup(event)"></div></div><div id="sections"><section class="section"><h2>💕 ラブラブ編 <small id="s0">0/15</small></h2><label class="item"><input type="checkbox" data-g="0" data-i="0"><span>手を繋いでデートする</span></label><label class="item"><input type="checkbox" data-g="0" data-i="1"><span>お揃いのアクセサリーを買う</span></label><label class="item"><input type="checkbox" data-g="0" data-i="2"><span>ペアルックでお出かけする</span></label><label class="item"><input type="checkbox" data-g="0" data-i="3"><span>一緒にプリクラを撮る</span></label><label class="item"><input type="checkbox" data-g="0" data-i="4"><span>お互いに手紙を書く</span></label><label class="item"><input type="checkbox" data-g="0" data-i="5"><span>記念日を毎年お祝いする</span></label><label class="item"><input type="checkbox" data-g="0" data-i="6"><span>一緒にお風呂に入る</span></label><label class="item"><input type="checkbox" data-g="0" data-i="7"><span>寝落ちするまで電話する</span></label><label class="item"><input type="checkbox" data-g="0" data-i="8"><span>お互いの好きなところを10個言う</span></label><label class="item"><input type="checkbox" data-g="0" data-i="9"><span>2人だけのアルバムを作る</span></label><label class="item"><input type="checkbox" data-g="0" data-i="10"><span>サプライズをし合う</span></label><label class="item"><input type="checkbox" data-g="0" data-i="11"><span>ハグをしながらまったりする</span></label><label class="item"><input type="checkbox" data-g="0" data-i="12"><span>おでこにキスする</span></label><label class="item"><input type="checkbox" data-g="0" data-i="13"><span>おそろいの香りをつける</span></label><label class="item"><input type="checkbox" data-g="0" data-i="14"><span>「好き」と「ありがとう」を毎日伝える</span></label></section><section class="section"><h2>🩵 デート・お出かけ編 <small id="s1">0/15</small></h2><label class="item"><input type="checkbox" data-g="1" data-i="0"><span>夜景を見に行く</span></label><label class="item"><input type="checkbox" data-g="1" data-i="1"><span>水族館デート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="2"><span>動物園デート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="3"><span>遊園地デート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="4"><span>映画館デート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="5"><span>温泉デート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="6"><span>ドライブデート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="7"><span>食べ歩きデート</span></label><label class="item"><input type="checkbox" data-g="1" data-i="8"><span>イルミネーションを見に行く</span></label><label class="item"><input type="checkbox" data-g="1" data-i="9"><span>星空を見に行く</span></label><label class="item"><input type="checkbox" data-g="1" data-i="10"><span>カフェ巡りをする</span></label><label class="item"><input type="checkbox" data-g="1" data-i="11"><span>おしゃれなランチ・ディナーに行く</span></label><label class="item"><input type="checkbox" data-g="1" data-i="12"><span>展望台に行って景色を楽しむ</span></label><label class="item"><input type="checkbox" data-g="1" data-i="13"><span>一緒にショッピングする</span></label><label class="item"><input type="checkbox" data-g="1" data-i="14"><span>大きな公園でのんびりデートする</span></label></section><section class="section"><h2>🧡 おうちデート編 <small id="s2">0/15</small></h2><label class="item"><input type="checkbox" data-g="2" data-i="0"><span>一緒に料理を作る</span></label><label class="item"><input type="checkbox" data-g="2" data-i="1"><span>一緒にケーキやお菓子を作る</span></label><label class="item"><input type="checkbox" data-g="2" data-i="2"><span>映画を見ながらゴロゴロする</span></label><label class="item"><input type="checkbox" data-g="2" data-i="3"><span>お泊まりデート</span></label><label class="item"><input type="checkbox" data-g="2" data-i="4"><span>一緒にゲームをする</span></label><label class="item"><input type="checkbox" data-g="2" data-i="5"><span>お揃いのパジャマを着る</span></label><label class="item"><input type="checkbox" data-g="2" data-i="6"><span>朝ごはんを一緒に作る</span></label><label class="item"><input type="checkbox" data-g="2" data-i="7"><span>お互いの好きな映画・ドラマを見る</span></label><label class="item"><input type="checkbox" data-g="2" data-i="8"><span>一緒に部屋の模様替えをする</span></label><label class="item"><input type="checkbox" data-g="2" data-i="9"><span>何もしない休日を一緒に過ごす</span></label><label class="item"><input type="checkbox" data-g="2" data-i="10"><span>一緒にお酒や飲み物を楽しむ</span></label><label class="item"><input type="checkbox" data-g="2" data-i="11"><span>2人で好きな音楽を聴く</span></label><label class="item"><input type="checkbox" data-g="2" data-i="12"><span>一緒に本や漫画を読む</span></label><label class="item"><input type="checkbox" data-g="2" data-i="13"><span>ペットと一緒にのんびり過ごす</span></label><label class="item"><input type="checkbox" data-g="2" data-i="14"><span>こたつでまったりする</span></label></section><section class="section"><h2>💜 旅行・季節イベント編 <small id="s3">0/15</small></h2><label class="item"><input type="checkbox" data-g="3" data-i="0"><span>浴衣を着て花火大会に行く</span></label><label class="item"><input type="checkbox" data-g="3" data-i="1"><span>夏祭りで屋台を回る</span></label><label class="item"><input type="checkbox" data-g="3" data-i="2"><span>海で夕日を見る</span></label><label class="item"><input type="checkbox" data-g="3" data-i="3"><span>紅葉を見に行く</span></label><label class="item"><input type="checkbox" data-g="3" data-i="4"><span>クリスマスデート</span></label><label class="item"><input type="checkbox" data-g="3" data-i="5"><span>初詣に行く</span></label><label class="item"><input type="checkbox" data-g="3" data-i="6"><span>桜を見ながらお花見する</span></label><label class="item"><input type="checkbox" data-g="3" data-i="7"><span>旅館に泊まる</span></label><label class="item"><input type="checkbox" data-g="3" data-i="8"><span>ディズニーに行く</span></label><label class="item"><input type="checkbox" data-g="3" data-i="9"><span>2人で飛行機旅行をする</span></label><label class="item"><input type="checkbox" data-g="3" data-i="10"><span>行ったことのない県に旅行する</span></label><label class="item"><input type="checkbox" data-g="3" data-i="11"><span>きれいな海や離島に旅行する</span></label><label class="item"><input type="checkbox" data-g="3" data-i="12"><span>雪景色を見に行く</span></label><label class="item"><input type="checkbox" data-g="3" data-i="13"><span>いちご狩りなど季節の味覚を楽しむ</span></label><label class="item"><input type="checkbox" data-g="3" data-i="14"><span>季節ごとのイベントを楽しむ</span></label></section></div><p class="note">✓ チェックはこのブラウザに自動保存されます。<br>「チェック状況を共有」はテキストを送る機能です。<br>別々のスマホ間での自動同期にはオンラインサービスが必要です。</p><footer>こうや ♡ ももちゃん　ずっと仲良しでいようね 💕</footer></main><script>
const groups=[['💕 ラブラブ編',['手を繋いでデートする','お揃いのアクセサリーを買う','ペアルックでお出かけする','一緒にプリクラを撮る','お互いに手紙を書く','記念日を毎年お祝いする','一緒にお風呂に入る','寝落ちするまで電話する','お互いの好きなところを10個言う','2人だけのアルバムを作る','サプライズをし合う','ハグをしながらまったりする','おでこにキスする','おそろいの香りをつける','「好き」と「ありがとう」を毎日伝える']],['🩵 デート・お出かけ編',['夜景を見に行く','水族館デート','動物園デート','遊園地デート','映画館デート','温泉デート','ドライブデート','食べ歩きデート','イルミネーションを見に行く','星空を見に行く','カフェ巡りをする','おしゃれなランチ・ディナーに行く','展望台に行って景色を楽しむ','一緒にショッピングする','大きな公園でのんびりデートする']],['🧡 おうちデート編',['一緒に料理を作る','一緒にケーキやお菓子を作る','映画を見ながらゴロゴロする','お泊まりデート','一緒にゲームをする','お揃いのパジャマを着る','朝ごはんを一緒に作る','お互いの好きな映画・ドラマを見る','一緒に部屋の模様替えをする','何もしない休日を一緒に過ごす','一緒にお酒や飲み物を楽しむ','2人で好きな音楽を聴く','一緒に本や漫画を読む','ペットと一緒にのんびり過ごす','こたつでまったりする']],['💜 旅行・季節イベント編',['浴衣を着て花火大会に行く','夏祭りで屋台を回る','海で夕日を見る','紅葉を見に行く','クリスマスデート','初詣に行く','桜を見ながらお花見する','旅館に泊まる','ディズニーに行く','2人で飛行機旅行をする','行ったことのない県に旅行する','きれいな海や離島に旅行する','雪景色を見に行く','いちご狩りなど季節の味覚を楽しむ','季節ごとのイベントを楽しむ']]];
const key='kouya-momo-checks-v1';let checks={};try{checks=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){};document.querySelectorAll('#sections input[type="checkbox"]').forEach(cb=>{const id=cb.dataset.g+'-'+cb.dataset.i;cb.checked=!!checks[id];cb.addEventListener('change',()=>{checks[id]=cb.checked;try{localStorage.setItem(key,JSON.stringify(checks))}catch(e){}update()})});function update(){let total=0;groups.forEach(([,items],g)=>{let n=items.filter((_,i)=>checks[g+'-'+i]).length;total+=n;document.getElementById('s'+g).textContent=n+'/15'});document.getElementById('done').textContent=total;document.getElementById('fill').style.width=(total/60*100)+'%';document.getElementById('message').textContent=total===60?'全部達成！2人ともおめでとう💗':total>=30?'半分達成！もっと思い出を増やそう💕':total>0?'2人の幸せが少しずつ増えてるね💗':'2人の楽しい時間、ここからスタート♡'}update();function makeText(){return 'こうや♡ももちゃんのやりたいことリスト\n\n'+groups.map(([name,items],g)=>name+'\n'+items.map((s,i)=>(checks[g+'-'+i]?'☑ ':'☐ ')+s).join('\n')).join('\n\n')+'\n\n達成：'+document.getElementById('done').textContent+'/60'}async function exportList(){let t=makeText();if(navigator.share){try{await navigator.share({title:'こうや♡ももちゃん',text:t});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(t);alert('チェック状況をコピーしたよ♡')}catch(e){prompt('この文章をコピーしてね',t)}}function downloadBackup(){let blob=new Blob([JSON.stringify({version:1,checks},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='こうやとももちゃん_チェック保存.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreBackup(e){const f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.checks||typeof data.checks!=='object'||Array.isArray(data.checks))throw Error();checks={};for(const [k,v] of Object.entries(data.checks))if(/^[0-3]-(?:[0-9]|1[0-4])$/.test(k)&&typeof v==='boolean')checks[k]=v;localStorage.setItem(key,JSON.stringify(checks));document.querySelectorAll('.section').forEach((s,g)=>s.querySelectorAll('input').forEach((cb,i)=>cb.checked=!!checks[g+'-'+i]));update();alert('読み込みできたよ♡')}catch(err){alert('対応していない保存ファイルです')}e.target.value=''}
</script></body></html>
